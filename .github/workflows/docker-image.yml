name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: frp-http-server:smoke
          platforms: linux/amd64

      - name: Smoke test container startup
        shell: bash
        run: |
          set -euo pipefail
          container=frp-http-server-smoke
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" \
            -e FRP_SUBDOMAIN_HOST=smoke.invalid \
            frp-http-server:smoke >/dev/null
          for _ in {1..15}; do
            if docker exec "$container" curl -fsS http://127.0.0.1/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frp-http-server:latest
          platforms: linux/amd64,linux/arm64
